<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My First Ceilidh - soundtrack check</title>
<style>body{font:16px system-ui;max-width:680px;margin:6vh auto;padding:24px;background:#101827;color:#e9eef9}button{padding:12px 22px;border:0;background:#9de6c2;border-radius:9px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#253347;padding:15px;border-radius:8px}#state{color:#ffd88d}</style>
<h1>🎻 Soundtrack check</h1><p>This page verifies the bundled audio without loading the 3D game. Open it from the same folder as <code>index.html</code>.</p><p id="path"></p><p id="state">Checking…</p><button id="play">▶ Play / pause the MP3</button><p>Tempo configured: <strong id="bpm"></strong> BPM. Music starts when you click Start Dancing, plays during the count-in, and continues uninterrupted on GO.</p><pre id="detail"></pre>
<script src="../settings.js"></script><script src="./settings.js"></script><script>
const c=window.CEILIDH_CONFIG||{},src=String(c.musicFile||'');const a=new Audio();a.preload='auto';a.src=src;document.getElementById('path').textContent='Music path: '+src;document.getElementById('bpm').textContent=c.bpm||'(not set)';const state=document.getElementById('state'),detail=document.getElementById('detail');detail.textContent='Resolved URL: '+a.src;const status=(v)=>state.textContent=v;a.onloadedmetadata=()=>status('✓ Loaded '+Math.round(a.duration)+' seconds of audio');a.onerror=()=>status('✗ File failed to load (error code '+(a.error?.code||'?')+'). Check its path, extension and encoding.');document.getElementById('play').onclick=async()=>{try{if(a.paused){await a.play();status('♫ Playing. You should hear your track now.')}else{a.pause();status('Paused.')}}catch(e){status('✗ Playback failed: '+e.message)}};a.load();
</script></html>
